<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Administrator Login | SIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body" data-portal="admin">

    <div class="login-card">
        <div class="top-red-bar"></div>

        <div class="card-content">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 2L4 5V10C4 15 7.5 19.5 12 21C16.5 19.5 20 15 20 10V5L12 2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M12 7.5V13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <circle cx="12" cy="16.2" r="0.9" fill="currentColor"/>
            </svg>
            <h2 class="sys-title">STUDENT INFORMATION SYSTEM</h2>
            <h3 class="login-header">System Administrator Login</h3>

            <form id="loginForm" class="auth-step">
                <div class="input-group">
                    <label for="email">Admin Email Address</label>
                    <input type="email" id="email" placeholder="Enter your administrator email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" class="login-btn">Login</button>

                <div id="loginMessage" class="login-message" style="display: none;"></div>
            </form>

            <!-- Hidden until POST /api/login responds with { requireOtp: true }
                 (admin accounts only - see controllers/authController.js and
                 admin_login.js). Never submitted directly by the user without
                 that response occurring first. -->
            <form id="otpForm" class="auth-step" style="display: none;">
                <p class="otp-instructions">Enter the 6-digit code sent to <strong id="otpEmailDisplay"></strong>.</p>

                <div class="input-group">
                    <label for="otp">Verification Code</label>
                    <input type="text" id="otp" class="otp-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
                </div>

                <button type="submit" class="login-btn">Verify</button>
                <button type="button" id="backToLoginBtn" class="link-btn">&larr; Back to login</button>

                <div id="otpMessage" class="login-message" style="display: none;"></div>
            </form>

            <p class="signup-text" id="backToStudentLink"><a href="/">&larr; Back to Student Login</a></p>

            <div class="login-notice" id="testAccountsNote">
                <p class="login-notice__title">Restricted Access</p>
                <p>This portal is reserved for authorized system administrators. All sign-in attempts are monitored and recorded.</p>
            </div>
        </div>
    </div>

    <script src="admin_login.js"></script>
</body>
</html>
